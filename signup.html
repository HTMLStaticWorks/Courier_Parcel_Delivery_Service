<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | SWIFT</title>
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-section);
      padding: 2rem;
      position: relative;
    }
    .auth-card {
      background-color: var(--bg-card);
      width: 100%;
      max-width: 520px;
      padding: 3rem 2rem;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      transition: var(--transition);
    }
    .auth-logo {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }
    .auth-logo i {
      color: var(--accent);
    }
  </style>
</head>
<body>

  <!-- Floating Auth Controls for Theme & RTL Toggle -->
  <div class="auth-controls">
    <button class="icon-btn" id="themeToggle" aria-label="Toggle Theme" title="Toggle Theme"><i class="fas fa-moon"></i></button>
    <button class="icon-btn" id="dirToggle" aria-label="Toggle RTL/LTR" title="Toggle RTL/LTR" style="font-weight: 700; font-size: 0.8rem;">RTL</button>
    <a href="index.html" class="icon-btn" aria-label="Go to Homepage" title="Go Home"><i class="fas fa-home"></i></a>
  </div>

  <div class="auth-page fade-in">
    <div class="auth-card">
      <a href="index.html" class="auth-logo">
        <svg width="28" height="24" viewBox="0 0 36 32" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 10H9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M1 16H10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M5 22H8" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M23 4L13 9L23 14L33 9L23 4Z" fill="currentColor"/><path d="M13 9V21L23 26V14L13 9Z" fill="var(--accent)"/><path d="M33 9V21L23 26V14L33 9Z" fill="var(--accent)" fill-opacity="0.65"/></svg> SWIFT
      </a>
      
      <h2 class="text-center mb-1" data-en="Create an Account" data-ar="إنشاء حساب جديد">Create an Account</h2>
      <p class="text-center text-muted mb-4" data-en="Join SWIFT for easy shipment management" data-ar="انضم إلى SWIFT لإدارة شحناتك بسهولة">Join SWIFT for easy shipment management</p>
      
      <form action="dashboard.html" method="GET">
        <div class="form-group">
          <label class="form-label" data-en="Full Name" data-ar="الاسم الكامل">Full Name</label>
          <input type="text" class="form-control" data-en-placeholder="John Doe" data-ar-placeholder="أحمد محمد" placeholder="John Doe" required>
        </div>

        <div class="grid grid-cols-2 gap-2" style="margin-bottom: 0;">
          <div class="form-group">
            <label class="form-label" data-en="Email Address" data-ar="البريد الإلكتروني">Email Address</label>
            <input type="email" class="form-control" data-en-placeholder="john@example.com" data-ar-placeholder="john@example.com" placeholder="john@example.com" required>
          </div>
          
          <div class="form-group">
            <label class="form-label" data-en="Phone Number" data-ar="رقم الهاتف">Phone Number</label>
            <input type="tel" class="form-control" data-en-placeholder="+1 (555) 000-0000" data-ar-placeholder="+1 (555) 000-0000" placeholder="+1 (555) 000-0000" required>
          </div>
        </div>
        
        <div class="grid grid-cols-2 gap-2" style="margin-bottom: 0;">
          <div class="form-group">
            <label class="form-label" data-en="Password" data-ar="كلمة المرور">Password</label>
            <div class="password-input-wrapper">
              <input type="password" class="form-control" data-en-placeholder="Create password" data-ar-placeholder="إنشاء كلمة المرور" placeholder="Create password" required>
              <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>
          
          <div class="form-group">
            <label class="form-label" data-en="Confirm Password" data-ar="تأكيد كلمة المرور">Confirm Password</label>
            <div class="password-input-wrapper">
              <input type="password" class="form-control" data-en-placeholder="Confirm password" data-ar-placeholder="تأكيد كلمة المرور" placeholder="Confirm password" required>
              <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>
        </div>
        
        <div class="form-group flex items-center gap-2 mt-2">
          <input type="checkbox" id="terms" required style="width: 1rem; height: 1rem; cursor: pointer;">
          <label for="terms" style="cursor: pointer; user-select: none; font-size: 0.875rem;">
            <span data-en="I accept the" data-ar="أوافق على">I accept the</span> 
            <a href="#" data-en="Terms & Conditions" data-ar="الشروط والأحكام">Terms & Conditions</a> 
            <span data-en="and" data-ar="و">and</span> 
            <a href="#" data-en="Privacy Policy" data-ar="سياسة الخصوصية">Privacy Policy</a>.
          </label>
        </div>
        
        <button type="submit" class="btn btn-primary btn-full mt-2" data-en="Create Account" data-ar="إنشاء حساب">Create Account</button>
      </form>
      
      <div class="auth-divider">
        <span data-en="Or continue with" data-ar="أو المتابعة باستخدام">Or continue with</span>
      </div>
      <div class="social-auth-grid">
        <button type="button" class="btn btn-outline btn-full"><i class="fab fa-google"></i> Google</button>
        <button type="button" class="btn btn-outline btn-full"><i class="fab fa-facebook-f"></i> Facebook</button>
      </div>
      
      <div class="text-center mt-4">
        <p class="text-muted">
          <span data-en="Already have an account?" data-ar="لديك حساب بالفعل؟">Already have an account?</span> 
          <a href="login.html" style="font-weight: 600;" data-en="Log in" data-ar="تسجيل الدخول">Log in</a>
        </p>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
