<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | SWIFT</title>
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-section);
      padding: 2rem;
    }
    .auth-card {
      background-color: var(--bg-card);
      width: 100%;
      max-width: 400px;
      padding: 3rem 2rem;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
    }
    .auth-logo {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }
    .auth-logo i {
      color: var(--accent);
    }
    .auth-controls {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      display: flex;
      gap: 1rem;
    }
    [dir="rtl"] .auth-controls {
      right: auto;
      left: 1.5rem;
    }
  </style>
</head>
<body>

  <div class="auth-controls">
    <button class="icon-btn" id="themeToggle" aria-label="Toggle Theme"><i class="fas fa-moon"></i></button>
    <button class="icon-btn" id="dirToggle" aria-label="Toggle RTL/LTR" style="font-weight: 700; font-size: 0.875rem;">RTL</button>
    <a href="index.html" class="icon-btn" aria-label="Go to Homepage"><i class="fas fa-home"></i></a>
  </div>

  <div class="auth-page fade-in">
    <div class="auth-card">
      <a href="index.html" class="auth-logo">
        <i class="fas fa-box-open"></i> SWIFT
      </a>
      
      <h2 class="text-center mb-1">Welcome Back</h2>
      <p class="text-center text-muted mb-4">Log in to manage your shipments</p>
      
      <form action="dashboard.html" method="GET">
        <div class="form-group">
          <label class="form-label">Email or Phone Number</label>
          <input type="text" class="form-control" placeholder="Enter email or phone" required>
        </div>
        
        <div class="form-group">
          <div class="flex justify-between items-center mb-2">
            <label class="form-label mb-0">Password</label>
            <a href="#" style="font-size: 0.875rem;">Forgot Password?</a>
          </div>
          <input type="password" class="form-control" placeholder="Enter password" required>
        </div>
        
        <div class="form-group flex items-center gap-2">
          <input type="checkbox" id="rememberMe" style="width: 1rem; height: 1rem;">
          <label for="rememberMe" style="cursor: pointer; user-select: none;">Remember Me</label>
        </div>
        
        <button type="submit" class="btn btn-primary btn-full mt-2">Login</button>
      </form>
      
      <div class="text-center mt-4">
        <p class="text-muted">Don't have an account? <a href="signup.html" style="font-weight: 600;">Sign up</a></p>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
