<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | SWIFT</title>
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-section);
      padding: 2rem;
      position: relative;
    }
    .auth-card {
      background-color: var(--bg-card);
      width: 100%;
      max-width: 420px;
      padding: 3rem 2rem;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      transition: var(--transition);
    }
    .auth-logo {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }
    .auth-logo i {
      color: var(--accent);
    }
  </style>
</head>
<body>

  <!-- Floating Auth Controls for Theme & RTL Toggle -->
  <div class="auth-controls">
    <button class="icon-btn" id="themeToggle" aria-label="Toggle Theme" title="Toggle Theme"><i class="fas fa-moon"></i></button>
    <button class="icon-btn" id="dirToggle" aria-label="Toggle RTL/LTR" title="Toggle RTL/LTR" style="font-weight: 700; font-size: 0.8rem;">RTL</button>
    <a href="index.html" class="icon-btn" aria-label="Go to Homepage" title="Go Home"><i class="fas fa-home"></i></a>
  </div>

  <div class="auth-page fade-in">
    <div class="auth-card">
      <a href="index.html" class="auth-logo">
        <i class="fas fa-box-open"></i> SWIFT
      </a>
      
      <h2 class="text-center mb-1" data-en="Welcome Back" data-ar="مرحباً بعودتك">Welcome Back</h2>
      <p class="text-center text-muted mb-4" data-en="Log in to manage your shipments" data-ar="قم بتسجيل الدخول لإدارة شحناتك">Log in to manage your shipments</p>
      
      <form action="dashboard.html" method="GET">
        <div class="form-group">
          <label class="form-label" data-en="Email or Phone Number" data-ar="البريد الإلكتروني أو رقم الهاتف">Email or Phone Number</label>
          <input type="text" class="form-control" data-en-placeholder="Enter email or phone" data-ar-placeholder="أدخل البريد الإلكتروني أو رقم الهاتف" placeholder="Enter email or phone" required>
        </div>
        
        <div class="form-group">
          <div class="flex justify-between items-center mb-2">
            <label class="form-label mb-0" data-en="Password" data-ar="كلمة المرور">Password</label>
            <a href="#" style="font-size: 0.875rem;" data-en="Forgot Password?" data-ar="هل نسيت كلمة المرور؟">Forgot Password?</a>
          </div>
          <div class="password-input-wrapper">
            <input type="password" class="form-control" data-en-placeholder="Enter password" data-ar-placeholder="أدخل كلمة المرور" placeholder="Enter password" required>
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>
        
        <div class="form-group flex items-center gap-2">
          <input type="checkbox" id="rememberMe" style="width: 1rem; height: 1rem; cursor: pointer;">
          <label for="rememberMe" style="cursor: pointer; user-select: none;" data-en="Remember Me" data-ar="تذكرني">Remember Me</label>
        </div>
        
        <button type="submit" class="btn btn-primary btn-full mt-2" data-en="Login" data-ar="تسجيل الدخول">Login</button>
      </form>
      
      <div class="text-center mt-4">
        <p class="text-muted">
          <span data-en="Don't have an account?" data-ar="ليس لديك حساب؟">Don't have an account?</span> 
          <a href="signup.html" style="font-weight: 600;" data-en="Sign up" data-ar="إنشاء حساب">Sign up</a>
        </p>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
